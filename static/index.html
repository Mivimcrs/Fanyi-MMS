<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>莱·梵壹 · 会员实时跟踪管理系统</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e15; --bg2:#0e121b; --panel:#131826; --panel2:#182031; --panel3:#1d2740;
  --border:#25304a; --border2:#2f3d5c;
  --text:#e9edf6; --muted:#8b94ab; --muted2:#5f687d;
  --violet:#a78bfa; --violet2:#7c5cf0; --rose:#f0a6c0; --gold:#f2c14e;
  --teal:#3ddbb0; --amber:#fbbf24; --red:#f87171; --gray:#94a3b8; --slate:#64748b;
  --shadow:0 8px 32px rgba(0,0,0,.45);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(124,92,240,.14), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(61,219,176,.07), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; line-height:1.55;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3450;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{
  width:228px;flex:0 0 228px;background:linear-gradient(180deg,#101624,#0c101a);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.brand .logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.brand .mark{
  width:36px;height:36px;border-radius:11px;flex:0 0 36px;
  background:linear-gradient(135deg,var(--violet2),var(--rose));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;color:#fff;letter-spacing:.5px;
  box-shadow:0 4px 18px rgba(124,92,240,.45);
}
.brand h1{font-size:15.5px;font-weight:700;letter-spacing:.5px}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.brand .store-name{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:.2px}
.brand .store-name.on{cursor:pointer}
.brand .store-name.on:hover{color:var(--violet2)}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;color:var(--muted);font-size:14px;font-family:inherit;
  padding:10px 12px;border-radius:10px;cursor:pointer;transition:.15s;
}
.nav button:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav button.active{background:linear-gradient(90deg,rgba(124,92,240,.22),rgba(124,92,240,.05));color:#fff;box-shadow:inset 0 0 0 1px rgba(167,139,250,.25)}
.nav button .ic{width:18px;height:18px;flex:0 0 18px;opacity:.9}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.save-state{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;background:rgba(61,219,176,.08);border:1px solid rgba(61,219,176,.2)}
.save-state.warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.25)}
.save-state .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex:0 0 8px}
.save-state.warn .dot{background:var(--amber)}
.save-state .retry{margin-left:auto;background:none;border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:2px 8px;font-size:11.5px;cursor:pointer;font-family:inherit}
.save-state .retry:hover{border-color:var(--violet)}
.side-foot .mini{margin-top:10px;display:flex;gap:6px}
.side-foot .mini button{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 0;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.side-foot .mini button:hover{color:var(--text);border-color:var(--border2)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1460px;margin:0 auto;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.page-head h2{font-size:22px;font-weight:700;letter-spacing:.3px}
.page-head .desc{color:var(--muted);font-size:13px;margin-top:4px}
.page-head .actions{display:flex;gap:10px;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;font-family:inherit;
  border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;transition:.15s;
  background:var(--panel2);color:var(--text);border:1px solid var(--border);
}
.btn:hover{border-color:var(--border2);background:var(--panel3)}
.btn.primary{background:linear-gradient(135deg,var(--violet2),#9d6bf5);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(124,92,240,.35)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.gold{background:linear-gradient(135deg,#d8a13c,#f2c14e);border-color:transparent;color:#221a05;box-shadow:0 4px 16px rgba(242,193,78,.25)}
.btn.danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3);color:#fca5a5}
.btn.danger:hover{background:rgba(248,113,113,.2)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:14px}
.kpi{
  background:linear-gradient(160deg,var(--panel),var(--bg2));
  border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;
  position:relative;overflow:hidden;transition:.2s;
}
.kpi:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:var(--shadow)}
.kpi .k-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-label .kd{width:7px;height:7px;border-radius:50%;display:inline-block}
.kpi .k-value{font-size:26px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.kpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.money .k-value{background:linear-gradient(90deg,#f5d78e,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi.big .k-value{font-size:28px}
.kpi .glow{position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;filter:blur(34px);opacity:.35;pointer-events:none}

/* ---------- range bar ---------- */
.range-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px}
.range-bar .rb-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
.range-bar .input{width:150px}
.rb-sep{color:var(--muted);font-size:12.5px}
.rb-info{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.rb-info b{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- panels & charts ---------- */
.panel{background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.panel h3{font-size:14.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h3 .hint{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:auto}
.chart-row{display:grid;grid-template-columns:340px 340px 1fr;gap:14px;margin-bottom:14px}
.chart-row2{display:grid;grid-template-columns:1fr 400px;gap:14px}
.donut-wrap{display:flex;align-items:center;gap:18px}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.legend .li .sw{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.legend .li b{color:var(--text);font-variant-numeric:tabular-nums}
.legend .li .pct{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:9px 10px;
  border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:2;
}
table.tbl td{padding:9px 10px;border-bottom:1px solid rgba(37,48,74,.5);white-space:nowrap;font-variant-numeric:tabular-nums}
table.tbl tbody tr{cursor:pointer;transition:.12s}
table.tbl tbody tr:hover{background:rgba(167,139,250,.06)}
table.tbl .num{ text-align:right}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2.5px 10px;border-radius:99px;font-size:11.5px;font-weight:600}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.normal{color:var(--teal);background:rgba(61,219,176,.1)}
.pill.warning{color:var(--amber);background:rgba(251,191,36,.1)}
.pill.sleeping{color:var(--red);background:rgba(248,113,113,.1)}
.pill.expired{color:var(--gray);background:rgba(148,163,184,.12)}
.pill.refund{color:var(--slate);background:rgba(100,116,139,.15)}
.pill.pending{color:#6096ff;background:rgba(96,150,255,.12)}
.card-tag{display:inline-block;padding:1.5px 8px;border-radius:6px;font-size:11.5px;font-weight:600}
.card-tag.期限卡{color:#a5c8ff;background:rgba(96,150,255,.12)}
.card-tag.次卡{color:var(--rose);background:rgba(240,166,192,.1)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}
.input,.select{
  background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:10px;
  padding:8px 12px;font-size:13px;font-family:inherit;outline:none;transition:.15s;min-width:0;
}
.input:focus,.select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,92,240,.15)}
.input{width:230px}
.select{width:auto}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{background:none;border:none;color:var(--muted);padding:8px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
.seg button.on{background:var(--panel3);color:#fff}

.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.badge{display:inline-block;background:rgba(167,139,250,.12);color:var(--violet);border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:600}

/* ---------- drawer ---------- */
.drawer-mask{position:fixed;inset:0;background:rgba(5,8,14,.6);backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:.25s}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:-560px;width:560px;max-width:94vw;height:100vh;z-index:51;
  background:linear-gradient(180deg,#141a29,#0e121b);border-left:1px solid var(--border);
  box-shadow:-20px 0 60px rgba(0,0,0,.5);transition:right .28s cubic-bezier(.2,.8,.25,1);
  display:flex;flex-direction:column;
}
.drawer.show{right:0}
.drawer-head{padding:20px 22px 16px;border-bottom:1px solid var(--border)}
.drawer-head .row1{display:flex;align-items:center;gap:12px}
.drawer-head h3{font-size:18px;font-weight:700}
.drawer-head .mid{color:var(--muted);font-size:13px}
.drawer-head .close{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:4px}
.drawer-head .close:hover{color:var(--text)}
.drawer-body{flex:1;overflow-y:auto;padding:20px 22px}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px}
.drawer-foot .btn{flex:1;justify-content:center}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:20px}
.info-grid .cell{background:var(--bg2);border:1px solid rgba(37,48,74,.6);border-radius:10px;padding:9px 12px}
.info-grid .cell.wide{grid-column:1/-1}
.info-grid .lbl{font-size:11.5px;color:var(--muted)}
.info-grid .val{font-size:14px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;word-break:break-all}
.progress{height:8px;border-radius:99px;background:var(--chart-track);overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet2),var(--violet))}
.sub-title{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sub-title::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--violet)}

/* ---------- modal ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(5,8,14,.66);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{
  width:540px;max-width:94vw;max-height:90vh;overflow-y:auto;border-radius:16px;
  background:linear-gradient(170deg,#161d2e,#10141f);border:1px solid var(--border2);
  box-shadow:var(--shadow);transform:translateY(12px) scale(.98);transition:.22s;
}
.modal-mask.show .modal{transform:none}
.modal-head{padding:18px 22px 0;display:flex;align-items:center}
.modal-head h3{font-size:16.5px;font-weight:700}
.modal-head .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.modal-body{padding:16px 22px}
.modal-foot{padding:4px 22px 20px;display:flex;gap:10px;justify-content:flex-end}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field label .req{color:var(--red)}
.field .input,.field .select{width:100%}
.field textarea.input{resize:vertical;min-height:56px;width:100%}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;user-select:none}
.chk input{accent-color:var(--violet2);width:15px;height:15px}
.form-tip{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
.form-tip b{color:var(--gold)}

/* ---------- toast ---------- */
#toast-root{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:#182034;border:1px solid var(--border2);border-radius:11px;padding:10px 18px;
  font-size:13px;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;
  animation:pop .25s cubic-bezier(.2,.9,.3,1.2);max-width:88vw;
}
.toast.ok{border-color:rgba(61,219,176,.4)}.toast.ok .ti{color:var(--teal)}
.toast.warn{border-color:rgba(251,191,36,.45)}.toast.warn .ti{color:var(--amber)}
.toast.err{border-color:rgba(248,113,113,.45)}.toast.err .ti{color:var(--red)}
.toast .ti{font-size:15px}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.95)}to{opacity:1}}
.fade-out{animation:fo .3s forwards}
@keyframes fo{to{opacity:0;transform:translateY(-8px)}}

.mono{font-variant-numeric:tabular-nums}
.gold-t{color:var(--gold)}
.muted{color:var(--muted)}
.link{color:var(--violet);cursor:pointer;font-size:12px;background:none;border:none;font-family:inherit;padding:0}
.link:hover{text-decoration:underline}
.link.danger{color:var(--red)}

@media (max-width:1200px){
  .kpi-grid{grid-template-columns:repeat(4,1fr)}
  .chart-row{grid-template-columns:1fr 1fr}
  .chart-row2{grid-template-columns:1fr}
}
@media (max-width:860px){
  .sidebar{position:fixed;z-index:60;left:-228px;transition:left .25s}
  .sidebar.open{left:0}
  main{padding:18px 14px 50px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .chart-row{grid-template-columns:1fr}
  .info-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  #menu-btn{display:inline-flex !important}
}
#menu-btn{display:none;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:8px 12px;cursor:pointer}

/* ---- 图表/结构色变量（随主题切换） ---- */
:root{
  --chart-track:#1a2236; --grid-line:#1c2438;
  --axis-muted:#5f687d; --axis-amber:#8a7230;
  --bar1:#a78bfa; --bar2:#7c5cf0;
}

/* ===== 白日模式：鼠尾草绿 #5F8D7E + 暖米 #FBF9F5 =====
   墨色文字 #373737 ≈ 11.2:1（> AA 7:1，达 AAA）
   主色按钮 鼠尾草底 + 墨字 #1B1B1B ≈ 4.6:1（达 AA） */
html[data-theme="day"]{
  color-scheme:light;
  --bg:#FBF9F5; --bg2:#F3EFE5; --panel:#FFFFFF; --panel2:#F5F1E8; --panel3:#ECE7DA;
  --border:#E2DBC9; --border2:#D2C9B0;
  --text:#373737;            /* 墨色文字 */
  --muted:#5C5547; --muted2:#857D6A;
  --violet:#3F6B5C;          /* 深鼠尾草（文字/链接，AA） */
  --violet2:#4A7568;         /* 鼠尾草深端（进度/渐变） */
  --rose:#A85F78;
  --gold:#8A5A12;            /* 深金（金额文字，AA） */
  --teal:#257A5E; --amber:#8A5E16; --red:#B5372A; --gray:#6B6457; --slate:#5A5346;
  --shadow:0 8px 28px rgba(95,141,126,.18);
  --chart-track:#E7E1D2; --grid-line:#ECE6D7; --axis-muted:#857D6A; --axis-amber:#8A5A12;
  --bar1:#7BA697; --bar2:#4A7568;
}
html[data-theme="day"] body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(95,141,126,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(176,150,90,.06), transparent 60%),
    var(--bg);
}
html[data-theme="day"] ::-webkit-scrollbar-thumb{background:#C9BFA6}
html[data-theme="day"] .sidebar{background:linear-gradient(180deg,#FBF9F5,#F1EDE2)}
html[data-theme="day"] .nav button:hover{background:rgba(95,141,126,.08);color:var(--text)}
html[data-theme="day"] .nav button.active{background:linear-gradient(90deg,rgba(95,141,126,.18),rgba(95,141,126,.04));color:var(--text);box-shadow:inset 0 0 0 1px rgba(95,141,126,.30)}
html[data-theme="day"] .save-state{background:rgba(37,122,94,.08);border-color:rgba(37,122,94,.25)}
html[data-theme="day"] .save-state.warn{background:rgba(138,94,22,.08);border-color:rgba(138,94,22,.30)}
html[data-theme="day"] .side-foot .mini button{background:rgba(95,141,126,.05);border-color:var(--border)}
html[data-theme="day"] .side-foot .mini button:hover{color:var(--text);border-color:var(--border2)}
html[data-theme="day"] .btn{background:var(--panel2);border-color:var(--border)}
html[data-theme="day"] .btn:hover{background:var(--panel3)}
html[data-theme="day"] .btn.primary{background:linear-gradient(135deg,#5F8D7E,#4A7568);color:#1B1B1B;box-shadow:0 4px 16px rgba(95,141,126,.30)}
html[data-theme="day"] .btn.primary:hover{filter:brightness(1.03)}
html[data-theme="day"] .btn.gold{background:linear-gradient(135deg,#C9932F,#9A6A1B);color:#1B1B1B}
html[data-theme="day"] .btn.danger{background:rgba(181,55,42,.10);border-color:rgba(181,55,42,.30);color:#B5372A}
html[data-theme="day"] .kpi{background:linear-gradient(160deg,#FFFFFF,#F3EFE5)}
html[data-theme="day"] .kpi:hover{border-color:var(--border2)}
html[data-theme="day"] .range-bar,
html[data-theme="day"] .panel{background:linear-gradient(160deg,#FFFFFF,#F4F0E7)}
html[data-theme="day"] table.tbl th{background:#FFFFFF}
html[data-theme="day"] table.tbl td{border-bottom-color:rgba(120,108,80,.20)}
html[data-theme="day"] table.tbl tbody tr:hover{background:rgba(95,141,126,.06)}
html[data-theme="day"] .info-grid .cell{border-color:var(--border)}
html[data-theme="day"] .drawer{background:linear-gradient(180deg,#FFFFFF,#F4F0E7);box-shadow:-20px 0 60px rgba(95,141,126,.18)}
html[data-theme="day"] .modal{background:linear-gradient(170deg,#FFFFFF,#F6F2EA)}
html[data-theme="day"] .toast{background:#FFFFFF}
html[data-theme="day"] .seg button.on{background:var(--panel3);color:var(--text)}
html[data-theme="day"] .badge{background:rgba(95,141,126,.12);color:var(--violet)}

<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">

      <div>
        <h1>莱·梵壹<span id="store-name" class="store-name" title="点击修改门店名称"></span></h1>

        数据大屏
      </button>

      <div class="mini">

        <button id="btn-store" title="设置名称，显示在左上角品牌名旁">门店名称</button>
        <button id="btn-swap-file" title="选择另一份表格文件（.xlsx / .xlsm）">更换表格</button>

  <main>
    <div class="page-head" id="page-head">

      <div>
        <h2 id="page-title">数据大屏</h2>
        <div class="desc" id="page-desc"></div>
      </div>
      <div class="actions" id="page-actions"></div>

    <section id="view-dashboard"></section>
    <section id="view-members" style="display:none"></section>

</div>

<div class="drawer-mask" id="drawer-mask"></div>
<div class="drawer" id="drawer"></div>

<div id="toast-root"></div>
<button id="theme-toggle" title="切换 白日 / 黑夜模式" aria-label="切换主题">
  <svg class="ti-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>
  <svg class="ti-moon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <span class="lbl-to-day">白日模式</span>
  <span class="lbl-to-night">黑夜模式</span>
</button>

<script>
"use strict";
/* ==================================================================== */
const S = {
  data: null,
  view: "dashboard",
  storeName: null, // null=未设置；""=已跳过；字符串=已设置
  range: null, // 大屏统计时间范围 {start, end}
  filters: { q: "", status: "", card: "", teacher: "", pStart: "", pEnd: "" },
  recFilters: { q: "", range: "all" },
  drawerMember: null,
};

const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtMoney = v => "¥" + (Math.round((v || 0) * 100) / 100).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = v => (Math.round(v || 0)).toLocaleString("zh-CN");
const today = () => S.data?.dashboard?.today || new Date().toISOString().slice(0, 10);

const STATUS_META = {
  "正常":    { cls: "normal",   color: "#3ddbb0" },
  "预警客户": { cls: "warning",  color: "#fbbf24" },
  "沉睡客户": { cls: "sleeping", color: "#f87171" },
  "待开卡":  { cls: "pending",  color: "#6096ff" },
  "已到期":  { cls: "expired",  color: "#94a3b8" },
  "退卡":    { cls: "refund",   color: "#64748b" },
};
const statusPill = st => {
  const m = STATUS_META[st] || { cls: "expired", color: "#94a3b8" };
  return `<span class="pill ${m.cls}">${esc(st)}</span>`;
};

/* ---------------------------------------------------------------- api */
async function api(path, body, method) {
  const opt = { method: method || (body ? "POST" : "GET"), headers: {} };
  if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  let j = null;
  try { j = await r.json(); } catch (e) {}
  if (!r.ok || (j && j.ok === false)) throw new Error((j && j.error) || ("请求失败 " + r.status));
  return j;
}

async function refresh(keepDrawer) {
  const j = await api("/api/data");
  S.data = j.data;
  S.storeName = j.store_name ?? null;
  render();
  if (!keepDrawer) closeDrawer();
}

/* ---------- 门店名称：顶栏展示 + 设置弹窗 ---------- */
function renderBrand() {
  const el = $("#store-name");
  if (!el) return;
  const n = S.storeName;
  if (n) {
    el.textContent = "· " + n;
    el.classList.add("on");
  } else {
    el.textContent = "";
    el.classList.remove("on");
  }
}
function promptStoreName(auto) {
  const root = modal(`
    <div class="modal-head"><h3>${auto ? "欢迎使用 · 设置门店名称" : "门店名称"}<button class="x">×</button></h3></div>
    <div class="modal-body" style="font-size:13.5px;line-height:1.9">${auto
      ? "首次使用，请填写门店名称。它将以小字显示在左上角品牌名「莱·梵壹」旁，可随时修改。"
      : "门店名称将显示在左上角品牌名「莱·梵壹」旁，可随时修改。"}<br>
      <input class="input" id="sn-input" placeholder="例如：万达广场店" maxlength="20" value="${esc(S.storeName || "")}" style="width:100%;margin-top:6px">
    </div>
    <div class="modal-foot">
      <button class="btn" id="sn-skip">跳过</button>
      <button class="btn primary" id="sn-save">保存</button>
    </div>`);
  const input = $("#sn-input", root);
  const save = async () => {
    const name = input.value.trim();
    const btn = $("#sn-save", root);
    btn.disabled = true;
    try {
      const j = await api("/api/store-name", { name });
      S.storeName = j.store_name ?? null;
      renderBrand();
      closeModal();
      toast(name ? `门店名称已保存：${name}` : "已跳过设置门店名称", "ok");
    } catch (e) { toast(e.message, "err"); btn.disabled = false; }
  };
  $("#sn-save", root).addEventListener("click", save);
  $("#sn-skip", root).addEventListener("click", save);
  input.addEventListener("keydown", e => { if (e.key === "Enter") save(); });
  input.focus();
}
function bindStore() {
  $("#store-name").addEventListener("click", () => promptStoreName(false));
  $("#btn-store").addEventListener("click", () => promptStoreName(false));
}

/* ---------------------------------------------------------------- toast */
function toast(msg, type) {
  const el = document.createElement("div");
  el.className = "toast " + (type || "ok");
  const icon = type === "err" ? "✕" : type === "warn" ? "⚠" : "✓";
  el.innerHTML = `<span class="ti">${icon}</span><span>${esc(msg)}</span>`;
  $("#toast-root").appendChild(el);
  setTimeout(() => { el.classList.add("fade-out"); setTimeout(() => el.remove(), 350); }, type === "warn" ? 5200 : 3200);
}

/* ---------------------------------------------------------------- nav */
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.view = b.dataset.view;
  $$("#nav button").forEach(x => x.classList.toggle("active", x === b));
  $("#sidebar").classList.remove("open");
  render();
});
$("#menu-btn").addEventListener("click", () => $("#sidebar").classList.toggle("open"));

/* ==================================================================== */
/* DASHBOARD（支持自定义统计时间范围）                                    */
/* ==================================================================== */
const localISO = dd => dd.getFullYear() + "-" + String(dd.getMonth() + 1).padStart(2, "0") + "-" + String(dd.getDate()).padStart(2, "0");
function addDays(ds, n) { const d = new Date(ds + "T00:00:00"); d.setDate(d.getDate() + n); return localISO(d); }

function presetRanges() {
  const t = today();
  const monthStart = t.slice(0, 8) + "01";
  const prevEnd = addDays(monthStart, -1);            // 上月最后一天
  const prevStart = prevEnd.slice(0, 8) + "01";       // 上月第一天
  let minDate = t;
  S.data.classes.forEach(c => { if (c.date && c.date < minDate) minDate = c.date; });
  return [
    { k: "today",  l: "今天",   s: t,               e: t },
    { k: "yday",   l: "昨天",   s: addDays(t, -1),  e: addDays(t, -1) },
    { k: "d7",     l: "近7天",  s: addDays(t, -6),  e: t },
    { k: "d30",    l: "近30天", s: addDays(t, -29), e: t },
    { k: "month",  l: "本月",   s: monthStart,      e: t },
    { k: "pmonth", l: "上月",   s: prevStart,       e: prevEnd },
    { k: "all",    l: "全部",   s: minDate,         e: t },
  ];
}

function rangeStats(cs, start, end) {
  const list = cs.filter(c => c.valid && c.date && c.date >= start && c.date <= end);
  return {
    list,
    count: list.length,
    effect: list.filter(c => c.effect).length,
    rev: list.reduce((a, c) => a + (c.unit_price || 0), 0),
  };
}

function rangeIncome(ms, start, end) {
  const list = ms.filter(m => m.purchase_date && m.purchase_date >= start && m.purchase_date <= end);
  return {
    list,
    count: list.length,
    amount: list.reduce((a, m) => a + (m.amount || 0), 0),
  };
}

function buildTrendData(cs, start, end) {
  const s = new Date(start + "T00:00:00"), e = new Date(end + "T00:00:00");
  const days = Math.round((e - s) / 864e5) + 1;
  const revOf = list => list.reduce((a, c) => a + (c.unit_price || 0), 0);
  const t = [];
  if (days <= 62) {                       // 逐日
    for (let i = 0; i < days; i++) {
      const ds = addDays(start, i);
      const cl = cs.filter(c => c.date === ds && c.valid);
      t.push({ label: ds.slice(5).replace("-", "/"), ds, count: cl.length, rev: revOf(cl) });
    }
  } else {                                // 跨度太长，按月聚合
    let cur = new Date(s.getFullYear(), s.getMonth(), 1);
    const endM = new Date(e.getFullYear(), e.getMonth(), 1);
    while (cur <= endM) {
      const prefix = cur.getFullYear() + "-" + String(cur.getMonth() + 1).padStart(2, "0");
      const cl = cs.filter(c => (c.date || "").startsWith(prefix) && c.valid);
      t.push({ label: cur.getFullYear() + "/" + (cur.getMonth() + 1), ds: prefix, count: cl.length, rev: revOf(cl) });
      cur.setMonth(cur.getMonth() + 1);
    }
  }
  return t;
}

function renderDashboard() {
  const d = S.data.dashboard, ms = S.data.members, cs = S.data.classes;
  if (!S.range) S.range = { start: d.today, end: d.today };
  let { start, end } = S.range;
  if (start > end) { const tmp = start; start = end; end = tmp; S.range = { start, end }; }
  const rs = rangeStats(cs, start, end);
  const inc = rangeIncome(ms, start, end);
  const presets = presetRanges();
  const dayCount = Math.round((new Date(end + "T00:00:00") - new Date(start + "T00:00:00")) / 864e5) + 1;
  const monthStart = d.today.slice(0, 8) + "01";

  /* 耗课卡片文案随范围变化 */
  let revLabel = "区间耗课", revSub = `${start} ~ ${end} 耗课金额 · ${rs.count} 人次`;
  if (start === d.today && end === d.today) { revLabel = "今日耗课"; revSub = `今日耗课金额 · ${rs.count} 人次`; }
  else if (start === monthStart && end === d.today) { revLabel = "本月耗课"; revSub = `本月累计耗课 · ${rs.count} 人次`; }

  /* 营收（办卡收入）卡片文案随范围变化 */
  let incLabel = "区间营收", incSub = `${start} ~ ${end} 办卡金额 · ${inc.count} 笔`;
  if (start === d.today && end === d.today) { incLabel = "今日营收"; incSub = `今日办卡金额 · ${inc.count} 笔`; }

  const kpiCard = k => `<div class="kpi ${k.money ? "money" : ""} ${k.big ? "big" : ""}" data-kpi="${k.key}" style="cursor:pointer" title="点击查看明细">
      <div class="glow" style="background:${k.c}"></div>
      <div class="k-label"><span class="kd" style="background:${k.c}"></span>${k.l}</div>
      <div class="k-value" data-count>${k.v}</div>
      <div class="k-sub">${k.s}</div>
    </div>`;
  /* 门店客户状态（9 项） */
  const statusKpis = [
    { key: "total", l: "总客户数", v: fmtInt(d.total), s: "档案中会员卡记录总数", c: "#a78bfa" },
    { key: "valid_period", l: "有效期客户", v: fmtInt(d.valid_period), s: "卡在有效期内（未退卡）", c: "#3ddbb0" },
    { key: "expired", l: "已到期", v: fmtInt(d.expired), s: "次卡耗尽或期限过期", c: "#94a3b8" },
    { key: "period_card", l: "期限卡客户", v: fmtInt(d.period_card), s: "按时段计费的会员卡", c: "#6096ff" },
    { key: "session_card", l: "次卡客户", v: fmtInt(d.session_card), s: "按次数计费的会员卡", c: "#f0a6c0" },
    { key: "pending", l: "待开卡客户", v: fmtInt(d.pending), s: "已购卡但尚未开卡", c: "#6096ff" },
    { key: "normal", l: "正常客户", v: fmtInt(d.normal), s: "连续未到 &lt; 7 天", c: "#3ddbb0" },
    { key: "warning", l: "预警客户", v: fmtInt(d.warning), s: "连续未到 7–9 天", c: "#fbbf24" },
    { key: "sleeping", l: "沉睡客户", v: fmtInt(d.sleeping), s: "连续未到 ≥ 10 天", c: "#f87171" },
    { key: "refunded", l: "退卡客户", v: fmtInt(d.refunded), s: "已办理退卡", c: "#64748b" },
    { key: "effect", l: "效果图", v: fmtInt(rs.effect), s: start === end ? `${start} 已发效果图` : `${start} ~ ${end} 已发效果图`, c: "#3ddbb0" },
  ].map(kpiCard).join("");
  /* 门店收支状态（5 项） */
  const moneyKpis = [
    { key: "range_income", l: incLabel, v: fmtMoney(inc.amount), s: incSub, c: "#22c55e", money: 1 },
    { key: "month_income", l: "本月营收", v: fmtMoney(d.month_income), s: "本月办卡金额（固定口径）", c: "#14b8a6", money: 1 },
    { key: "range_revenue", l: revLabel, v: fmtMoney(rs.rev), s: revSub, c: "#f2c14e", money: 1 },
    { key: "month_revenue", l: "本月耗课", v: fmtMoney(d.month_revenue), s: "本月累计耗课金额（固定口径）", c: "#f2c14e", money: 1 },
    { key: "liability", l: "累计负债", v: fmtMoney(d.liability), s: "全部在卡会员剩余课程总额", c: "#f87171", money: 1, big: 1 },
  ].map(kpiCard).join("");

  /* status donut */
  const st = [
    { label: "正常", value: d.normal, color: "#3ddbb0" },
    { label: "预警", value: d.warning, color: "#fbbf24" },
    { label: "沉睡", value: d.sleeping, color: "#f87171" },
    { label: "待开卡", value: d.pending, color: "#6096ff" },
    { label: "已到期", value: d.expired, color: "#94a3b8" },
    { label: "退卡", value: d.refunded, color: "#64748b" },
  ];
  /* card donut */
  const ct = [
    { label: "期限卡", value: d.period_card, color: "#6096ff" },
    { label: "次卡", value: d.session_card, color: "#f0a6c0" },
    { label: "退卡", value: d.refunded, color: "#64748b" },
  ];
  /* trend: 所选范围 */
  const t = buildTrendData(cs, start, end);
  /* teacher perf: 所选范围 */
  const tp = {};
  rs.list.forEach(c => {
    const k = c.teacher || "未分配";
    tp[k] = tp[k] || { count: 0, rev: 0 };
    tp[k].count++; tp[k].rev += c.unit_price || 0;
  });
  const teachers = Object.entries(tp).map(([k, v]) => ({ label: k, ...v }))
    .sort((a, b) => b.rev - a.rev).slice(0, 8);

  /* sleeping alert list */
  const sleepTop = ms.filter(m => m.status === "沉睡客户" && !m.refund)
    .sort((a, b) => (b.days_absent ?? 99999) - (a.days_absent ?? 99999)).slice(0, 8);

  $("#view-dashboard").innerHTML = `
    <div class="range-bar">
      <span class="rb-title">⏱ 统计时间范围</span>
      <input type="date" class="input" id="rg-start" value="${start}">
      <span class="rb-sep">至</span>
      <input type="date" class="input" id="rg-end" value="${end}">
      <div class="seg" id="rg-presets">${presets.map(p =>
        `<button data-k="${p.k}" class="${start === p.s && end === p.e ? "on" : ""}">${p.l}</button>`).join("")}</div>
      <span class="rb-info">共 <b>${dayCount}</b> 天 · <b>${rs.count}</b> 次课 · 耗课 <b>${fmtMoney(rs.rev)}</b></span>
    </div>
    <div class="panel" style="margin-bottom:14px"><h3>门店客户状态</h3><div class="kpi-grid" style="margin-bottom:0">${statusKpis}</div></div>
    <div class="panel" style="margin-bottom:14px"><h3>门店收支状态</h3><div class="kpi-grid" style="margin-bottom:0">${moneyKpis}</div></div>
    <div class="chart-row">
      <div class="panel"><h3>客户状态分布</h3>${donut(st)}</div>
      <div class="panel"><h3>卡种结构</h3>${donut(ct)}</div>

/* ---------- svg charts ---------- */
function donut(segs) {
  const total = segs.reduce((a, s) => a + s.value, 0) || 1;
  const R = 62, C = 2 * Math.PI * R;
  let off = 0, arcs = "";
  segs.forEach(s => {
    const len = s.value / total * C;
    if (s.value > 0) arcs += `<circle cx="85" cy="85" r="${R}" fill="none" stroke="${s.color}" stroke-width="21"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)" stroke-linecap="butt" opacity=".92"/>`;
    off += len;
  });
  return `<div class="donut-wrap">
    <svg width="170" height="170" viewBox="0 0 170 170">
      <circle cx="85" cy="85" r="${R}" fill="none" style="stroke:var(--chart-track)" stroke-width="21"/>
      ${arcs}
      <text x="85" y="80" text-anchor="middle" style="fill:var(--text)" font-size="26" font-weight="800">${total}</text>
      <text x="85" y="102" text-anchor="middle" style="fill:var(--muted)" font-size="11">会员卡数</text>
    </svg>
    <div class="legend">${segs.map(s => `
      <div class="li"><span class="sw" style="background:${s.color}"></span>${s.label}
        <b>${s.value}</b><span class="pct">${(s.value / total * 100).toFixed(0)}%</span></div>`).join("")}
    </div></div>`;
}

function trendChart(t) {
  const W = 640, H = 210, PL = 44, PR = 56, PT = 18, PB = 30;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxC = Math.max(4, ...t.map(x => x.count));
  const maxR = Math.max(1, ...t.map(x => x.rev));
  const bw = Math.max(3, Math.min(26, iw / t.length * 0.52));
  const step = iw / t.length;
  const skip = t.length > 20 ? Math.ceil(t.length / 12) : 1;   // 标签抽稀
  const yC = v => PT + ih - v / maxC * ih;
  const yR = v => PT + ih - v / maxR * ih;
  let bars = "", line = "", labels = "";
  t.forEach((x, i) => {
    const cx = PL + step * i + step / 2;
    const h = x.count / maxC * ih;
    bars += `<rect x="${cx - bw / 2}" y="${yC(x.count)}" width="${bw}" height="${Math.max(h, x.count ? 2 : 0)}" rx="${Math.min(3.5, bw / 2)}"
      fill="url(#gv)" opacity="${x.ds === today() ? 1 : .78}"/>`;
    if (x.count && t.length <= 35) bars += `<text x="${cx}" y="${yC(x.count) - 6}" text-anchor="middle" style="fill:var(--muted)" font-size="9.5">${x.count}</text>`;
    if (i % skip === 0) labels += `<text x="${cx}" y="${H - 10}" text-anchor="middle" style="fill:var(--muted)" font-size="9.5">${x.label}</text>`;
  });
  const pts = t.map((x, i) => [PL + step * i + step / 2, yR(x.rev)]);
  const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  line = `<path d="${path}" fill="none" style="stroke:var(--gold)" stroke-width="2.2" stroke-linejoin="round"/>` +
    pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" style="fill:var(--gold)"/>`).join("");
  const gridY = [0, .5, 1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--bar1)"/><stop offset="1" style="stop-color:var(--bar2);stop-opacity:.35"/>
    </linearGradient></defs>
    ${gridY.map(g => `<line x1="${PL}" x2="${W - PR}" y1="${PT + ih * g}" y2="${PT + ih * g}" style="stroke:var(--grid-line)" stroke-width="1"/>
      <text x="${PL - 8}" y="${PT + ih * g + 4}" text-anchor="end" style="fill:var(--axis-muted)" font-size="9.5">${Math.round(maxC * (1 - g))}</text>
      <text x="${W - PR + 8}" y="${PT + ih * g + 4}" style="fill:var(--axis-amber)" font-size="9.5">¥${Math.round(maxR * (1 - g))}</text>`).join("")}
    ${bars}${labels}${line}
  </svg>`;
}

function hbars(items) {
  if (!items.length) return `<div class="empty">暂无上课记录</div>`;
  const max = Math.max(...items.map(i => i.rev)) || 1;
  return items.map(i => `
    <div style="margin-bottom:13px">
      <div style="display:flex;font-size:12.5px;margin-bottom:5px">
        <span>${esc(i.label)}</span>
        <span style="margin-left:auto" class="muted">${i.count} 人次</span>
        <b style="margin-left:14px;color:var(--gold)">${fmtMoney(i.rev)}</b>
      </div>
      <div style="height:9px;border-radius:99px;background:var(--chart-track);overflow:hidden">
        <div style="height:100%;width:${(i.rev / max * 100).toFixed(1)}%;border-radius:99px;background:linear-gradient(90deg,var(--bar2),var(--bar1))"></div>
      </div>
    </div>`).join("");
}

  const { q, range } = S.recFilters;

  const t0 = today(), base = new Date(t0 + "T00:00:00");
  let cs = S.data.classes.filter(c => {
    if (qn && !(c.member_name.toLowerCase().includes(qn) || c.member_id.toLowerCase().includes(qn) || (c.course || "").toLowerCase().includes(qn))) return false;

function modal(html) {
  const root = $("#modal-root");
  root.innerHTML = `<div class="modal-mask show"><div class="modal">${html}</div></div>`;
  const mask = $(".modal-mask", root);
  mask.addEventListener("mousedown", e => { if (e.target === mask) closeModal(); });
  const x = $(".x", root); if (x) x.addEventListener("click", closeModal);
  return root;
}
function closeModal() { $("#modal-root").innerHTML = ""; }

/* ---------- KPI 明细弹窗（点击大屏卡片查看关联数据） ---------- */
function openKpiDetail(key) {
  const d = S.data.dashboard, ms = S.data.members, cs = S.data.classes;
  const t = d.today, monthP = t.slice(0, 7);
  let { start, end } = S.range || { start: t, end: t };
  if (start > end) { const tmp = start; start = end; end = tmp; }
  const byId = (a, b) => a.id.localeCompare(b.id, "zh", { numeric: true });
  const incTitle = (start === t && end === t) ? "今日营收" : `${start} ~ ${end} 营收`;
  const revTitle = (start === t && end === t) ? "今日耗课" : `${start} ~ ${end} 耗课`;
  const effTitle = (start === t && end === t) ? "今日效果图" : `${start} ~ ${end} 效果图`;

  /* 会员类卡片：弹会员列表，点行进详情抽屉（可编辑/加课/退卡） */
  const M = {
    total:        ["总客户数", m => true, "id"],
    valid_period: ["有效期客户", m => !m.refund && m.expiry_date && m.expiry_date >= t, "id"],
    expired:      ["已到期", m => !m.refund && m.status === "已到期", "id"],
    period_card:  ["期限卡客户", m => !m.refund && m.card_type === "期限卡", "id"],
    session_card: ["次卡客户", m => !m.refund && m.card_type === "次卡", "id"],
    pending:      ["待开卡客户", m => !m.refund && m.status === "待开卡", "id"],
    normal:       ["正常客户", m => !m.refund && m.status === "正常", "id"],
    warning:      ["预警客户", m => !m.refund && m.status === "预警客户", "id"],
    sleeping:     ["沉睡客户", m => !m.refund && m.status === "沉睡客户", "id"],
    refunded:     ["退卡客户", m => m.refund, "id"],
    range_income: [incTitle, m => m.purchase_date && m.purchase_date >= start && m.purchase_date <= end, "purchase_date"],
    month_income: ["本月营收", m => (m.purchase_date || "").startsWith(monthP), "purchase_date"],
    liability:    ["累计负债", m => !m.refund && m.remaining_value > 0, "remaining_value"],
  };
  /* 上课记录类卡片：弹上课记录列表，可删除误录记录 */
  const C = {
    range_revenue: [revTitle, c => c.valid && c.date && c.date >= start && c.date <= end],
    month_revenue: ["本月耗课", c => c.valid && (c.date || "").startsWith(monthP)],
    effect: [effTitle, c => c.valid && c.effect && c.date && c.date >= start && c.date <= end],
  };

  if (M[key]) {
    const [title, fn, sortBy] = M[key];
    let list = ms.filter(fn);
    if (sortBy === "purchase_date") list.sort((a, b) => (b.purchase_date || "").localeCompare(a.purchase_date || "") || byId(a, b));
    else if (sortBy === "remaining_value") list.sort((a, b) => (b.remaining_value || 0) - (a.remaining_value || 0) || byId(a, b));
    else list.sort(byId);
    openMemberListModal(title, list);
  } else if (C[key]) {
    const [title, fn] = C[key];
    let list = cs.filter(fn).sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")) || a.row - b.row);
    openClassListModal(title, list);
  }
}

function confirmModal(title, bodyHtml, onOk) {
  const root = modal(`
    <div class="modal-head"><h3>${esc(title)}</h3><button class="x">×</button></div>
    <div class="modal-body" style="font-size:13.5px;line-height:1.7">${bodyHtml}</div>
    <div class="modal-foot"><button class="btn" id="cm-cancel">取消</button><button class="btn primary" id="cm-ok">确定</button></div>`);
  $("#cm-cancel", root).addEventListener("click", closeModal);
  $("#cm-ok", root).addEventListener("click", async () => {
    const b = $("#cm-ok", root); b.disabled = true; b.textContent = "处理中…";
    try { await onOk(); } catch (e) { toast(e.message, "err"); b.disabled = false; b.textContent = "确定"; }
  });
}

async function afterMutation(j, okMsg) {
  closeModal();
  _versions = null;  // 失效历史版本缓存，下次进入时重新拉取
  await refresh(true);
  renderSaveState();
  if (j && j.saved === false) toast((okMsg || "已提交") + "。但保存到表格失败：" + (j.meta?.pending_reason || ""), "warn");
  else toast(okMsg + "，已保存到表格", "ok");
  if (S.drawerMember) openDrawer(S.drawerMember.id);
  if (S.view === "members") renderMemberRows();
  if (S.view === "versions") renderVersions();
}

/* ---------- 新增客户 / 办新卡 ---------- */
function openMemberModal(_, editMember) {
  const isEdit = !!editMember;
  const ms = S.data.members;
  const persons = [];
  const seen = new Set();
  ms.forEach(m => {
    const k = normPhone(m.phone) || m.name;

  });
  const teachers = [...new Set(ms.map(m => m.teacher).filter(Boolean))];
  const types = [...new Set(ms.map(m => m.member_type).filter(Boolean))].concat(["私教", "普拉提小班"]).filter((v, i, a) => a.indexOf(v) === i);

  const root = modal(`
    <div class="modal-head"><h3>${isEdit ? "编辑会员资料" : "新增客户 / 办新卡"}</h3><button class="x">×</button></div>
    <div class="modal-body"><div class="form-grid">
      ${isEdit ? "" : `
      <div class="field wide">
        <label>办卡方式</label>
        <div class="seg" id="mm-mode">
          <button data-m="new" class="on">新客户办卡</button><button data-m="old">已有客户新办卡</button>
        </div>
      </div>
      <div class="field wide" id="mm-person-box" style="display:none">
        <label>选择客户</label>
        <select class="select" id="mm-person">
          <option value="">— 请选择客户 —</option>
          ${persons.map(p => `<option value="${esc(p.id)}" data-name="${esc(p.name)}" data-phone="${esc(p.phone)}" data-teacher="${esc(p.teacher)}">${esc(p.name)}（${esc(p.id)}）</option>`).join("")}
        </select>
      </div>`}
      <div class="field"><label>会员姓名 <span class="req">*</span></label><input class="input" id="mm-name" value="${esc(isEdit ? editMember.name : "")}"></div>
      <div class="field"><label>手机号</label><input class="input" id="mm-phone" value="${esc(isEdit ? editMember.phone : "")}" placeholder="用于识别同一客户"></div>
      <div class="field"><label>负责老师</label>
        <input class="input" id="mm-teacher" list="mm-teachers" value="${esc(isEdit ? editMember.teacher : "")}">
        <datalist id="mm-teachers">${teachers.map(t => `<option value="${esc(t)}">`).join("")}</datalist></div>
      <div class="field"><label>会员类型</label>
        <input class="input" id="mm-type" list="mm-types" value="${esc(isEdit ? editMember.member_type : "")}">
        <datalist id="mm-types">${types.map(t => `<option value="${esc(t)}">`).join("")}</datalist></div>
      <div class="field"><label>卡种 <span class="req">*</span></label>
        <select class="select" id="mm-card">
          <option value="次卡" ${isEdit && editMember.card_type === "次卡" ? "selected" : ""}>次卡（按次数）</option>
          <option value="期限卡" ${isEdit && editMember.card_type === "期限卡" ? "selected" : ""}>期限卡（按时间）</option>
        </select></div>
      <div class="field"><label>购买日期</label><input class="input" type="date" id="mm-purchase" value="${isEdit ? (editMember.purchase_date || today()) : today()}"></div>
      <div class="field"><label>开卡日期</label><input class="input" type="date" id="mm-activation" value="${isEdit ? (editMember.activation_date || "") : ""}" title="留空 = 待开卡"></div>
      <div class="field"><label>有效期至 <span class="req" id="mm-exp-req">*</span></label><input class="input" type="date" id="mm-expiry" value="${isEdit ? (editMember.expiry_date || "") : ""}"></div>

      phone: $("#mm-phone", root).value.trim(),
      teacher: $("#mm-teacher", root).value.trim(),
      member_type: $("#mm-type", root).value.trim(),
      card_type: card,
      purchase_date: $("#mm-purchase", root).value,
      activation_date: $("#mm-activation", root).value,
      expiry_date: $("#mm-expiry", root).value,
      amount: $("#mm-amount", root).value,
      receivable: $("#mm-receivable", root).value,
      total_sessions: $("#mm-total", root).value,
      remark: $("#mm-remark", root).value.trim(),
    };

    if (card === "期限卡" && !payload.expiry_date) return toast("期限卡必须填写有效期至", "err");

    btn.disabled = true; btn.textContent = "保存中…";

      const j = isEdit
        ? await api("/api/members/update", { id: editMember.id, fields: payload })
        : await api("/api/members", payload);
      await afterMutation(j, isEdit ? "会员资料已更新" : `会员 ${payload.name} 已创建（${j.member_id}）`);
    } catch (e) { toast(e.message, "err"); btn.disabled = false; btn.textContent = isEdit ? "保存修改" : "创建会员"; }
  });
}

  $("#cm-submit", root).addEventListener("click", async () => {
    const btn = $("#cm-submit", root);
    const payload = {
      member_id: $("#cm-member", root).value,
      date: $("#cm-date", root).value,
      time: $("#cm-time", root).value,
      course: $("#cm-course", root).value.trim(),
      effect: $("#cm-effect", root).checked,
      remark: $("#cm-remark", root).value.trim(),
    };
    if (!payload.member_id) return toast("请选择上课会员", "err");
    if (!payload.date) return toast("请填写上课日期", "err");
    btn.disabled = true; btn.textContent = "保存中…";
    try {
      const j = await api("/api/classes", payload);
      await afterMutation(j, "上课记录已添加");
    } catch (e) { toast(e.message, "err"); btn.disabled = false; btn.textContent = "保存记录"; }
  });
}

/* ---------- 表格文件选择 / 上传 ---------- */
async function fileToBase64(f) {
  return await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = () => rej(new Error("文件读取失败"));
    r.readAsDataURL(f);
  });
}
function pickExcel() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".xlsx,.xlsm";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    toast("正在上传并加载「" + f.name + "」…", "ok");
    try {
      const b64 = await fileToBase64(f);
      await api("/api/file", { name: f.name, data_b64: b64 });
      S.range = null;
      S.data = null;
      await refresh();
      toast("已加载表格：" + f.name, "ok");
    } catch (e) { toast(e.message, "err"); }
  };
  inp.click();
}

      </svg>
      <h2 style="font-size:19px;margin-bottom:12px">未找到默认表格文件</h2>
      <p class="muted" style="font-size:13px;line-height:1.9">系统默认读取程序同目录下名为<br>
        <b style="color:var(--gold)">莱·梵壹会员实时跟踪管理系统*.xlsx</b><br>
        的表格文件，当前目录中未找到。<br>
        请手动选择任意名称的表格文件（仅支持 .xlsx / .xlsm，需含「会员档案」「上课记录」工作表）。</p>

    </div>

/* ---------- 上次未保存变更（挂起工件）恢复提示 ---------- */
function maybePromptPending() {
  const pr = S.data?.meta?.pending_recovery;
  if (!pr) return false;
  const root = modal(`
    <div class="modal-head"><h3>发现未保存的变更</h3><button class="x">×</button></div>
    <div class="modal-body" style="font-size:13.5px;line-height:1.9">
      上次保存时表格文件被 Excel/WPS 占用，变更已暂存：<br>
      <b>${esc(pr.summary || pr.action || "未知操作")}</b> <span class="muted">${esc(pr.ts || "")}</span><br>
      <span class="muted">「恢复」会用暂存的变更覆盖表格当前内容；「丢弃」则放弃这些变更，表格保持磁盘现状。</span>
    </div>
    <div class="modal-foot">
      <button class="btn danger" id="pr-discard">丢弃变更</button>
      <button class="btn primary" id="pr-recover">恢复到表格</button>
    </div>`);
  $("#pr-recover", root).addEventListener("click", async () => {
    const b = $("#pr-recover", root);
    b.disabled = true; b.textContent = "恢复中…";
    try {
      await api("/api/pending/recover", {});
      closeModal();
      S.data = null;
      await refresh();
      toast("已恢复上次未保存的变更", "ok");
    } catch (e) { toast(e.message, "err"); b.disabled = false; b.textContent = "恢复到表格"; }
  });
  $("#pr-discard", root).addEventListener("click", async () => {
    try {
      await api("/api/pending/discard", {});
      closeModal();
      await refresh(true);
      toast("已丢弃挂起的变更", "ok");
    } catch (e) { toast(e.message, "err"); }
  });
  return true;
}

/* ==================================================================== */
/* VERSIONS VIEW（历史版本回滚）                                          */
/* ==================================================================== */
const ACTION_META = {
  "新增会员": { c: "#3ddbb0", t: "新增会员" },
  "编辑会员": { c: "#a78bfa", t: "编辑会员" },
  "标记退卡": { c: "#64748b", t: "标记退卡" },
  "恢复会员": { c: "#3ddbb0", t: "恢复会员" },
  "添加上课": { c: "#6096ff", t: "添加上课" },
  "删除上课": { c: "#f87171", t: "删除上课" },
  "手动备份": { c: "#f2c14e", t: "手动备份" },
  "恢复前自动备份": { c: "#fbbf24", t: "恢复前快照" },
  "更换表格前备份": { c: "#f0a6c0", t: "换表前快照" },
  "重试保存": { c: "#94a3b8", t: "重试保存" },
  "保存": { c: "#94a3b8", t: "保存" },
};
let _versions = null;
async function ensureVersions() {
  if (!_versions) {
    try { _versions = (await api("/api/versions")).versions || []; }
    catch (e) { _versions = []; }
  }
  return _versions;
}
function fmtVersionTime(ts) {
  // ts = "20260827_160430"
  const m = /^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/.exec(ts || "");
  if (!m) return ts || "";
  return `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}:${m[6]}`;
}
function fmtSize(b) {
  if (!b) return "—";
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  return (b / 1048576).toFixed(2) + " MB";
}

async function renderVersions() {
  const el = $("#view-versions");
  const vs = await ensureVersions();
  if (!el.dataset.built) {
    el.dataset.built = 1;
    el.innerHTML = `
      <div class="toolbar">
        <button class="btn primary" id="v-backup">＋ 立即备份当前版本</button>
        <button class="btn" id="v-refresh">刷新列表</button>
        <div class="sp"></div>
        <span class="muted" id="v-count" style="font-size:12.5px"></span>
      </div>
      <div class="panel" style="padding:0;overflow:auto;max-height:calc(100vh - 210px)">
        <table class="tbl"><thead><tr>
          <th>时间</th><th>操作类型</th><th>说明</th><th class="num">大小</th><th>操作</th>
        </tr></thead><tbody id="v-tbody"></tbody></table>
      </div>
      <div class="form-tip" style="margin-top:14px">
        <b>说明</b>：每次新增/编辑/退卡/加课/删课前，系统会自动把改动前的表格状态存为一个历史版本（最多保留 100 个）。
        误操作后，找到对应时间点的版本点「恢复」即可回滚。恢复时会先把当前状态自动存一个「恢复前快照」，所以恢复本身也能再撤销。
      </div>`;
    $("#v-backup").addEventListener("click", async () => {
      const note = await openNotePrompt();
      if (note === null) return;
      try {
        const j = await api("/api/versions/backup", { note });
        _versions = j.versions; renderVersionRows();
        toast("已备份当前版本", "ok");
      } catch (e) { toast(e.message, "err"); }
    });
    $("#v-refresh").addEventListener("click", async () => {
      _versions = null; await ensureVersions(); renderVersionRows(); toast("已刷新", "ok");
    });
  }
  renderVersionRows();
}

function renderVersionRows() {
  const vs = _versions || [];
  $("#v-count").textContent = `共 ${vs.length} 个版本（最多保留 100 个）`;
  const tb = $("#v-tbody");
  tb.innerHTML = vs.length ? vs.map(v => {
    const m = ACTION_META[v.action] || { c: "#94a3b8", t: v.action || "操作" };
    return `<tr>
      <td class="mono">${esc(fmtVersionTime(v.ts))}</td>
      <td><span class="badge" style="background:${m.c}22;color:${m.c}">${esc(m.t)}</span></td>
      <td>${esc(v.summary || "—")}</td>
      <td class="num muted">${fmtSize(v.size)}</td>
      <td>
        <button class="link" data-restore="${esc(v.file)}">恢复此版本</button>
        <a class="link" href="/api/versions/download?file=${encodeURIComponent(v.file)}" download>下载</a>
      </td>
    </tr>`;
  }).join("") : `<tr><td colspan="5"><div class="empty">暂无历史版本</div></td></tr>`;
  $$("#v-tbody [data-restore]").forEach(b => b.addEventListener("click", () => {
    const file = b.dataset.restore;
    confirmModal("恢复历史版本",
      `将用该版本（<b>${esc(file)}</b>）<b>覆盖当前表格</b>。<br><span class="muted">恢复前会自动把当前状态存为一个「恢复前快照」，所以这次恢复也能再撤销。若当前表格正被 Excel 打开会恢复失败，请先关闭。</span>`,
      async () => {
        const j = await api("/api/versions/restore", { file });
        _versions = j.versions;
        S.range = null; S.data = null;
        await refresh(true);
        renderVersionRows();
        toast("已恢复到该历史版本，数据已重载", "ok");
      });
  }));
}

/* 一个简易文本输入弹窗（用于手动备份备注） */
function openNotePrompt() {
  return new Promise(resolve => {
    const root = modal(`
      <div class="modal-head"><h3>手动备份</h3><button class="x">×</button></div>
      <div class="modal-body">
        <div class="field wide"><label>备注（可选）</label>
          <input class="input" id="np-input" placeholder="如：月底结算前备份" autofocus></div>
        <div class="form-tip">将当前表格状态存为一个历史版本，之后可随时恢复。</div>
      </div>
      <div class="modal-foot"><button class="btn" id="np-cancel">取消</button>
        <button class="btn primary" id="np-ok">备份</button></div>`);
    const close = (v) => { closeModal(); resolve(v); };
    $(".x", root).addEventListener("click", () => close(null));
    $("#np-cancel", root).addEventListener("click", () => close(null));
    $("#np-ok", root).addEventListener("click", () => {
      close($("#np-input", root).value.trim());
    });
    $("#np-input", root).addEventListener("keydown", e => {
      if (e.key === "Enter") close(e.target.value.trim());
      if (e.key === "Escape") close(null);
    });
    setTimeout(() => $("#np-input", root)?.focus(), 50);
  });
}

/* ---------- 主题切换 ---------- */
const THEME_KEY = "lf_theme";
function applyTheme(t){ document.documentElement.setAttribute("data-theme", t === "day" ? "day" : "night"); }
$("#theme-toggle").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") === "day" ? "day" : "night";
  const next = cur === "day" ? "night" : "day";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
});

/* ---------- render root ---------- */
const VIEW_META = {
  dashboard: { t: "数据大屏", d: () => `${S.data.dashboard.today} · 实时同步自 Excel 表格` , a: "" },
  members: { t: "客户管理", d: () => "点击行查看会员详情、办新卡、标记退卡", a: "" },
  records: { t: "上课记录", d: () => "每次上课在此添加一条记录，所有统计自动联动", a: "" },
  versions: { t: "历史版本", d: () => "每次改动前自动存档，可随时恢复到任意历史版本", a: "" },
};
function render() {
  if (!S.data) return;
  $("#view-dashboard").style.display = S.view === "dashboard" ? "" : "none";
  $("#view-members").style.display = S.view === "members" ? "" : "none";
  $("#view-records").style.display = S.view === "records" ? "" : "none";
  $("#view-versions").style.display = S.view === "versions" ? "" : "none";
  const vm = VIEW_META[S.view];
  $("#page-title").textContent = vm.t;
  $("#page-desc").innerHTML = vm.d();
  renderSaveState();
  renderBrand();
  if (S.view === "dashboard") renderDashboard();
  else if (S.view === "members") renderMembers();
  else if (S.view === "records") renderRecords();
  else renderVersions();
}

/* ---------- boot ---------- */
(async function boot() {
  try {
    const j = await api("/api/data");
    S.storeName = j.store_name ?? null;
    bindStore();
    if (j.no_file) { renderSetup(); renderBrand(); if (S.storeName == null) promptStoreName(true); return; }
    S.data = j.data;
    render();
    // 首次运行：无挂起恢复弹窗时提示设置门店名称
    if (S.storeName == null && !maybePromptPending()) promptStoreName(true);
    setInterval(async () => {
      if ($(".modal-mask.show") || $("#drawer").classList.contains("show")) return;
      try { await refresh(true); } catch (e) {}
    }, 60000);
  } catch (e) {
    document.body.innerHTML = `<div style="padding:60px;text-align:center;color:var(--text)">
      <h2 style="margin-bottom:12px">加载失败</h2><p style="color:var(--muted)">${esc(e.message)}</p>
      <p style="margin-top:8px;color:var(--muted)">请确认服务已启动且 Excel 文件存在。</p></div>`;
  }
})();
</script>
